[package]
name = "muka-focus-stacking"
version = "0.1.0"
edition = "2021"
description = "Focus stacking: merge a focus-bracketed photo sequence into one all-in-focus image"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Attect/Muka-Focus-Stacking"
keywords = ["focus-stacking", "focus-bracketing", "photography", "macro", "image-processing"]
categories = ["multimedia::images", "command-line-utilities"]

[[bin]]
name = "muka"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
] }
rayon = "1"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
